<svg width="100" height="100" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
    <!-- Outer Glow Filter -->
    <defs>
        <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="2" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
        </filter>
    </defs>
    
    <!-- Stylized "Q" / Lightbulb / O shape -->
    <path d="M50 20C33.4315 20 20 33.4315 20 50C20 66.5685 33.4315 80 50 80C55.5228 80 60.7228 78.5074 65.2 75.9" 
          stroke="#22D3EE" stroke-width="4" stroke-linecap="round" filter="url(#glow)"/>
    
    <!-- Zig-zag / Lightning Bolt Tail -->
    <path d="M60 70L75 80L65 85L80 95" 
          stroke="#22D3EE" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
          
    <!-- Inner Circle / Core (optional, for depth) -->
    <circle cx="50" cy="50" r="15" stroke="#22D3EE" stroke-width="2" stroke-dasharray="2 4" opacity="0.5"/>
</svg>
