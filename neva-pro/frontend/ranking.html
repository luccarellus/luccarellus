<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>N.E.V.A Pro | Ranking</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="icon" type="image/png" href="assets/logo.png">
    <!-- Lucide Icons CDN -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        .podium-container {
            display: flex;
            align-items: flex-end;
            justify-content: center;
            gap: 16px;
            margin: 3rem 0;
            padding: 0 1rem;
        }

        .podium-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 120px;
        }

        .podium-avatar {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            font-weight: bold;
            color: white;
            margin-bottom: 12px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            position: relative;
        }

        .podium-avatar.rank-1 { background: linear-gradient(135deg, #fbbf24 0%, #d97706 100%); width: 80px; height: 80px; font-size: 32px; z-index: 10; margin-bottom: 20px;}
        .podium-avatar.rank-2 { background: linear-gradient(135deg, #94a3b8 0%, #475569 100%); }
        .podium-avatar.rank-3 { background: linear-gradient(135deg, #b45309 0%, #78350f 100%); }
        
        .crown-icon {
            position: absolute;
            top: -24px;
            color: #fbbf24;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.1));
            width: 28px;
            height: 28px;
            pointer-events: none;
        }

        .podium-block {
            width: 100%;
            border-radius: 12px 12px 4px 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 800;
            font-size: 2rem;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }

        .podium-block.rank-1 { height: 160px; background: linear-gradient(to bottom, #fde047, #eab308); }
        .podium-block.rank-2 { height: 120px; background: linear-gradient(to bottom, #d1d5db, #9ca3af); }
        .podium-block.rank-3 { height: 100px; background: linear-gradient(to bottom, #fcd34d, #d97706); } /* Bronzeish */

        .podium-name { font-weight: 700; color: var(--text-primary); text-align: center; margin-bottom: 4px; line-height: 1.15;}
        .podium-xp { font-size: 0.875rem; color: var(--text-secondary); text-align: center; margin-bottom: 12px;}

        /* Reserve space for the crown on 1st place so it doesn't overlap name/XP */
        .podium-avatar.rank-1 { margin-top: 28px; }

        .ranking-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-width: 800px;
            margin: 0 auto;
        }

        .ranking-row {
            display: flex;
            align-items: center;
            padding: 16px 24px;
            background: var(--bg-card);
            border-radius: 16px;
            border: 1px solid var(--border);
            transition: all 0.2s ease;
        }
        
        .ranking-row:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
            border-color: var(--primary-light);
        }

        .ranking-container {
            padding: 20px;
            border-radius: 24px;
            background: radial-gradient(circle at top right, rgba(0, 207, 200, 0.05), transparent 50%),
                        radial-gradient(circle at bottom left, rgba(0, 207, 200, 0.05), transparent 50%);
        }

        .ranking-row.current-user {
            background: rgba(0, 207, 200, 0.08);
            border-color: var(--primary-light);
            box-shadow: var(--shadow-md);
        }

        .rank-number {
            font-size: 1.25rem;
            font-weight: 800;
            color: var(--text-muted);
            width: 40px;
        }

        .user-info {
            display: flex;
            align-items: center;
            flex: 1;
            gap: 16px;
        }

        .avatar-small {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #e2e8f0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: #475569;
        }

        .user-details {
            display: flex;
            flex-direction: column;
        }

        .user-details .name { font-weight: 600; color: var(--text-primary); }
        .user-details .level { font-size: 0.875rem; color: var(--text-secondary); }

        .xp-info {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 700;
            color: var(--text-primary);
        }

        .xp-info i { color: #eab308; width: 18px;}

        /* Division Badges */
        .division-badge {
            font-size: 0.65rem;
            font-weight: 800;
            padding: 2px 8px;
            border-radius: 4px;
            text-transform: uppercase;
            letter-spacing: 0.02em;
            margin-left: 8px;
        }
        .div-elite { background: linear-gradient(135deg, #012b2a, #006d69); color: #6feeed; border: 1px solid rgba(0, 207, 200, 0.3); }
        .div-diamond { background: rgba(0, 207, 200, 0.05); color: var(--primary); border: 1px solid rgba(0, 207, 200, 0.2); }
        .div-platinum { background: #f8fafc; color: #64748b; border: 1px solid rgba(100,116,139,0.2); }

        /* Trend Indicators */
        .rank-trend {
            display: flex;
            align-items: center;
            gap: 2px;
            font-size: 0.7rem;
            font-weight: 700;
            width: 35px;
        }
        .trend-up { color: #10b981; }
        .trend-down { color: #ef4444; }
        .trend-neutral { color: #94a3b8; }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- Sidebar Container (Injected by main.js) -->
        <div id="sidebar-container"></div>

        <div class="main-wrapper">
            <!-- Navbar Container (Injected by main.js) -->
            <div id="navbar-container"></div>

            <main class="content">
                <section class="animate-fade">
                    <div class="page-header">
                        <h2>Ranking Global 🏆</h2>
                        <p>Competição acirrada! Veja onde você está entre os melhores.</p>
                    </div>

                    <div class="ranking-container">
                        <!-- Podium -->
                        <div class="podium-container" id="podium-container">
                            <!-- Rendered via JS -->
                        </div>

                        <!-- Ranking List -->
                        <div class="ranking-list" id="ranking-list">
                            <!-- Rendered via JS -->
                        </div>
                    </div>
                </section>
            </main>
        </div>
    </div>

    <!-- Script that loads sidebar/navbar -->
    <script src="js/main.js"></script>
    <script src="js/config.js"></script>
    <script src="js/ranking.js"></script>
</body>
</html>
