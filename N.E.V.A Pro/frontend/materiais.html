<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ENEM Pro | Materiais</title>
    <link rel="stylesheet" href="css/styles.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
    <div class="app-container">
        <div id="sidebar-container"></div>

        <div class="main-wrapper">
            <div id="navbar-container"></div>

            <main class="content">
                <section class="animate-fade">
                    <div class="page-header">
                        <h2>Materiais</h2>
                        <p>Resumos, PDFs e trilhas de estudo organizadas por assunto.</p>
                    </div>

                    <div class="card" style="padding: 2rem; display: flex; align-items: flex-start; gap: 16px;">
                        <div style="width: 44px; height: 44px; border-radius: 12px; background: rgba(16,185,129,0.12); color: #10b981; display: flex; align-items: center; justify-content: center; flex: 0 0 auto;">
                            <i data-lucide="construction" style="width: 22px;"></i>
                        </div>
                        <div>
                            <h3 class="font-bold" style="margin-bottom: 6px;">Tela indisponível no momento</h3>
                            <p class="text-muted" style="line-height: 1.6; margin-bottom: 14px;">
                                Estamos preparando esta área para disponibilizar materiais oficiais e recomendações personalizadas.
                                Em breve ela estará ativa para o público.
                            </p>
                            <a href="index.html" class="btn btn-primary">Voltar ao Dashboard</a>
                        </div>
                    </div>
                </section>
            </main>
        </div>
    </div>

    <script src="js/main.js"></script>
</body>
</html>
