<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ENEM Pro | Login</title>
    <link rel="stylesheet" href="css/styles.css">
    <!-- Lucide Icons CDN -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { margin: 0; display: flex; min-height: 100vh; }
        .split-login { display: flex; width: 100%; height: 100vh; }
        .login-visual { flex: 1; background: linear-gradient(135deg, #1e3a8a, #2563eb, #38bdf8); display: none; flex-direction: column; justify-content: center; align-items: center; padding: 40px; color: white; text-align: center; position: relative; overflow: hidden; }
        @media (min-width: 768px) { .login-visual { display: flex; } }
        .login-visual h2 { font-size: 2.5rem; font-weight: 800; margin-bottom: 20px; z-index: 1; }
        .login-visual p { font-size: 1.1rem; opacity: 0.9; max-width: 400px; line-height: 1.6; z-index: 1; }
        .visual-circle { position: absolute; border-radius: 50%; background: rgba(255,255,255,0.1); }
        .circle-1 { width: 300px; height: 300px; top: -50px; left: -50px; }
        .circle-2 { width: 500px; height: 500px; bottom: -100px; right: -100px; }
        
        .login-form-container { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 40px; background: var(--bg-main); }
        .login-form-wrapper { width: 100%; max-width: 400px; }
        .login-header { margin-bottom: 30px; text-align: center; }
        .login-header h1 { font-size: 2rem; font-weight: 800; color: #0f172a; margin-bottom: 10px; }
        .login-header p { color: #64748b; font-size: 0.95rem; }
        .logo-icon { width: 48px; height: 48px; background: linear-gradient(135deg, #38bdf8, #2563eb); border-radius: 12px; color: white; font-weight: 900; font-size: 1.5rem; display: flex; align-items: center; justify-content: center; margin: 0 auto 20px auto; box-shadow: 0 10px 25px -5px rgba(37, 99, 235, 0.4); }
        
        .form-group { margin-bottom: 20px; }
        .form-label { display: block; margin-bottom: 8px; font-size: 0.875rem; font-weight: 600; color: #334155; }
        .input-icon-wrapper { position: relative; }
        .input-icon-wrapper i { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: #94a3b8; width: 18px; }
        .form-input { width: 100%; padding: 12px 14px 12px 40px; border: 1px solid #e2e8f0; border-radius: 10px; font-size: 1rem; color: #0f172a; transition: all 0.3s ease; box-sizing: border-box; }
        .form-input:focus { outline: none; border-color: #38bdf8; box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2); }
        
        .login-btn { width: 100%; padding: 14px; background: #2563eb; color: white; border: none; border-radius: 10px; font-size: 1rem; font-weight: 700; cursor: pointer; transition: background 0.3s ease, transform 0.1s ease; margin-top: 10px; }
        .login-btn:hover { background: #1d4ed8; }
        .login-btn:active { transform: translateY(2px); }
        
        .form-actions { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; font-size: 0.875rem; }
        .remember-me { display: flex; align-items: center; gap: 8px; color: #475569; }
        .forgot-password { color: #2563eb; text-decoration: none; font-weight: 600; }
        .forgot-password:hover { text-decoration: underline; }
        
        .social-login { margin-top: 30px; text-align: center; }
        .social-divider { display: flex; align-items: center; margin-bottom: 20px; color: #94a3b8; font-size: 0.875rem; }
        .social-divider::before, .social-divider::after { content: ''; flex: 1; height: 1px; background: #e2e8f0; }
        .social-divider::before { margin-right: 10px; }
        .social-divider::after { margin-left: 10px; }
        .btn-google { width: 100%; padding: 12px; background: white; border: 1px solid #e2e8f0; border-radius: 10px; font-size: 0.95rem; font-weight: 600; color: #334155; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; transition: background 0.3s ease; }
        .btn-google:hover { background: #f8fafc; }
        
        .signup-prompt { margin-top: 40px; text-align: center; font-size: 0.9rem; color: #64748b; }
        .signup-prompt a { color: #2563eb; font-weight: 700; text-decoration: none; }
        .signup-prompt a:hover { text-decoration: underline; }
        
        .animate-up { animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards; opacity: 0; transform: translateY(20px); }
        @keyframes slideUp { to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>
    <div class="split-login">
        <!-- Visual Section (Left) -->
        <div class="login-visual">
            <div class="visual-circle circle-1"></div>
            <div class="visual-circle circle-2"></div>
            <div class="animate-up" style="animation-delay: 0.2s;">
                <h2>Gamifique seus estudos.</h2>
                <p>Domine o ENEM e vestibulares com uma trilha de aprendizado interativa, simulados inteligentes e um ranking nacional.</p>
            </div>
            
            <!-- Dashboard Preview Graphic -->
            <div class="animate-up" style="margin-top: 40px; width: 100%; max-width: 450px; background: rgba(255,255,255,0.1); backdrop-filter: blur(10px); padding: 20px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.2); box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25); animation-delay: 0.4s; z-index: 1;">
                <div style="display: flex; justify-content: space-between; margin-bottom: 20px;">
                    <div style="width: 40%; height: 12px; background: rgba(255,255,255,0.3); border-radius: 6px;"></div>
                    <div style="width: 20%; height: 12px; background: rgba(255,255,255,0.2); border-radius: 6px;"></div>
                </div>
                <div style="display: flex; gap: 10px;">
                    <div style="flex: 1; height: 100px; background: rgba(255,255,255,0.15); border-radius: 12px;"></div>
                    <div style="flex: 1; height: 100px; background: rgba(255,255,255,0.15); border-radius: 12px;"></div>
                </div>
            </div>
        </div>

        <!-- Form Section (Right) -->
        <div class="login-form-container">
            <div class="login-form-wrapper animate-up">
                <div class="login-header">
                    <div class="logo-icon">E</div>
                    <h1>Bem-vindo de volta!</h1>
                    <p>Entre para continuar a sua jornada rumo à universidade.</p>
                </div>

                <form id="loginForm" action="index.html">
                    <div class="form-group">
                        <label class="form-label" for="email">E-mail</label>
                        <div class="input-icon-wrapper">
                            <i data-lucide="mail"></i>
                            <input type="email" id="email" class="form-input" placeholder="seu@email.com" required>
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label" for="password">Senha</label>
                        <div class="input-icon-wrapper">
                            <i data-lucide="lock"></i>
                            <input type="password" id="password" class="form-input" placeholder="••••••••" required>
                        </div>
                    </div>

                    <div class="form-actions">
                        <label class="remember-me">
                            <input type="checkbox"> Lembre-me
                        </label>
                        <a href="#" class="forgot-password">Esqueceu a senha?</a>
                    </div>

                    <button type="submit" class="login-btn">Entrar na Plataforma</button>
                    
                    <div class="social-login">
                        <div class="social-divider">ou continue com</div>
                        <button type="button" class="btn-google">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
                                <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                                <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
                                <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
                            </svg>
                            Google
                        </button>
                    </div>

                    <div class="signup-prompt">
                        Ainda não tem conta? <a href="#">Crie sua conta agora</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
    <script>
        lucide.createIcons();
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            // Simulate Authentication Success
            this.querySelector('.login-btn').innerHTML = '<i data-lucide="loader" class="animate-spin"></i> Entrando...';
            lucide.createIcons();
            
            setTimeout(() => {
                window.location.href = 'index.html';
            }, 800);
        });
    </script>
</body>
</html>
